name: Fix Complexivo cover data

on:
  push:
    paths:
      - ".github/workflows/fix-complexivo-cover.yml"

permissions:
  contents: write

jobs:
  fix-cover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Correct cover names and roles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "Msg. Jefferson Villarreal": "Mgs. Jefferson Villarreal",
              "COORDINADOR DE CARRERAS": "Coordinador de Titulación y Eficiencia Terminal",
              "Mgde. Martha Tomalá": "Ing. Martha Tomalá",
              "COORDINADORA GENERAL DE CARRERAS": "Coordinadora General de Carreras",
              "Mgt. Alex León": "Dr. Alex León",
              "VICERRECTOR": "Vicerrector",
          }

          for filename in ["complexivo/app.js", "complexivo/full-document.js"]:
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              changed = False
              for old, new in replacements.items():
                  if old in text:
                      text = text.replace(old, new)
                      changed = True
              if not changed:
                  raise SystemExit(f"No se encontraron valores esperados en {filename}")
              path.write_text(text, encoding="utf-8")

          # Los datos institucionales de portada son fijos y no deben volver a
          # ser sobrescritos por una configuración antigua guardada en la nube.
          path = Path("complexivo/app.js")
          text = path.read_text(encoding="utf-8")
          marker = '''      const institutional=workspace.settings.find(row=>row.key==="institutional");
      if(institutional?.value && typeof institutional.value==="object"){
        state.institutional={...state.institutional,...institutional.value};
      }
'''
          replacement = '''      const institutional=workspace.settings.find(row=>row.key==="institutional");
      if(institutional?.value && typeof institutional.value==="object"){
        state.institutional={...state.institutional,...institutional.value};
      }
      // La portada utiliza los responsables institucionales oficiales vigentes.
      state.institutional=clone(defaultState.institutional);
'''
          if marker not in text:
              raise SystemExit("No se encontró el bloque institucional esperado en complexivo/app.js")
          text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit correction directly to main
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add complexivo/app.js complexivo/full-document.js
          git commit -m "Correct Complexivo cover names and roles"
          git push origin HEAD:main
