name: Fix Complexivo cover

on:
  push:
    paths:
      - ".github/workflows/fix-complexivo-cover.yml"

permissions:
  contents: write

jobs:
  fix-cover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Correct cover data
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          pairs = [
              ("Msg. Jefferson Villarreal", "Mgs. Jefferson Villarreal"),
              ("COORDINADOR DE CARRERAS", "Coordinador de Titulación y Eficiencia Terminal"),
              ("Mgde. Martha Tomalá", "Ing. Martha Tomalá"),
              ("COORDINADORA GENERAL DE CARRERAS", "Coordinadora General de Carreras"),
              ("Mgt. Alex León", "Dr. Alex León"),
              ("VICERRECTOR", "Vicerrector"),
          ]

          for filename in ("complexivo/app.js", "complexivo/full-document.js"):
              p = Path(filename)
              s = p.read_text(encoding="utf-8")
              for old, new in pairs:
                  s = s.replace(old, new)
              p.write_text(s, encoding="utf-8")
          PY

      - name: Commit fix directly to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add complexivo/app.js complexivo/full-document.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Correct Complexivo cover names and roles"
          git push origin HEAD:main
