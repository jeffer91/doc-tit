name: Patch Trabajo Section 10

on:
  push:
    paths:
      - '.github/workflows/patch-trabajo-section10.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: python .github/scripts/patch_trabajo_section10.py
      - name: Validate JavaScript
        run: |
          node --check trabajo-titulacion/indicators-config.js
          node --check trabajo-titulacion/full-document.js
          node --check trabajo-titulacion/app.js
      - name: Validate wiring
        run: |
          grep -q 'DOC_TIT_TRABAJO_INDICATORS' trabajo-titulacion/full-document.js
          grep -q 'resultsAnalysis' trabajo-titulacion/full-document.js
          grep -q 'resultsAnalysis:currentResultsAnalysisSnapshot()' trabajo-titulacion/app.js
          grep -q 'indicators-config.js' trabajo-titulacion/index.html
          ! grep -q 'Índice de satisfacción: resultado consolidado' trabajo-titulacion/full-document.js
      - name: Commit changes
        run: |
          git config user.name 'jeffer91'
          git config user.email 'jeffersonvillarreal91@gmail.com'
          git add trabajo-titulacion/full-document.js trabajo-titulacion/app.js trabajo-titulacion/index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Implement controlled Trabajo indicators section'
            git push
          fi
