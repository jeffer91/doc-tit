name: Harmonize DOC-TIT

on:
  push:
    paths:
      - '.github/workflows/harmonize-doc-tit.yml'

permissions:
  contents: write

jobs:
  harmonize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply harmonization
        run: python .github/scripts/harmonize_doc_tit.py
      - name: Validate JavaScript
        run: |
          node --check shared/module-ui.js
          node --check shared/pdf/standards.js
          node --check complexivo/data-workspace.js
          node --check trabajo-titulacion/full-document.js
          node --check articulo-academico/full-document.js
          node --check articulo-academico/app.js
      - name: Validate audit requirements
        run: |
          grep -q 'const RESOURCE_BLOCKS = \[' complexivo/data-workspace.js
          ! grep -A4 'const RESOURCE_BLOCKS' complexivo/data-workspace.js | grep -q 'Información adicional'
          grep -q 'smart-panel" hidden aria-hidden="true"' complexivo/index.html
          grep -q '5. Imágenes del documento' complexivo/index.html
          grep -q 'module-ui.js' trabajo-titulacion/index.html
          grep -q 'module-ui.js' articulo-academico/index.html
          grep -q 'sentenceCaseHeading' articulo-academico/full-document.js
          grep -q 'for(let p=2;p<=total;p++)' articulo-academico/full-document.js
          grep -q 'referenceParagraph' trabajo-titulacion/full-document.js
          grep -q 'referenceParagraph' articulo-academico/full-document.js
          grep -q 'headerWidthCm: 18' shared/pdf/standards.js
          grep -q 'lineHeightPt: 24' shared/pdf/standards.js
      - name: Commit harmonized application
        run: |
          git config user.name 'jeffer91'
          git config user.email 'jeffersonvillarreal91@gmail.com'
          git add complexivo/index.html complexivo/data-workspace.js trabajo-titulacion/full-document.js articulo-academico/full-document.js articulo-academico/app.js README.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Harmonize DOC-TIT structure and document format'
            git push
          fi
