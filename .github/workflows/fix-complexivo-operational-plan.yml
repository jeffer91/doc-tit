name: Fix Complexivo operational plan loader

on:
  push:
    paths:
      - ".github/workflows/fix-complexivo-operational-plan.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix script loading and outline
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('complexivo/index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('v=20260904-complete-1', 'v=20260904-hotfix-3')
          s = s.replace('v=20260904-complete-2', 'v=20260904-hotfix-3')

          institutional = '  <script src="pdf/config/institutional.js?v=20260904-hotfix-3"></script>\n'
          areas = '  <script src="pdf/config/areas.js?v=20260904-hotfix-3"></script>\n'
          if areas not in s:
              if institutional not in s:
                  raise SystemExit('institutional loader not found')
              s = s.replace(institutional, institutional + areas, 1)

          methodology = '  <script src="pdf/sections/methodology/index.js?v=20260904-hotfix-3"></script>\n'
          operational = '  <script src="pdf/sections/methodology/operational-plan.js?v=20260904-hotfix-3"></script>\n'
          if operational not in s:
              if methodology not in s:
                  raise SystemExit('methodology loader not found')
              s = s.replace(methodology, operational + methodology, 1)

          s = s.replace('  <script src="pdf/sections/general-summary.js?v=20260904-hotfix-3"></script>\n', '')
          p.write_text(s, encoding='utf-8')

          Path('complexivo/pdf/document-outline.js').write_text('''(() => {\n  "use strict";\n  const ns = window.DOC_TIT_COMPLEXIVO_PDF = window.DOC_TIT_COMPLEXIVO_PDF || {};\n  ns.outline = [\n    "introduction",\n    "legalBasis",\n    "methodology",\n    "requirements",\n    "examDescription",\n    "seminars",\n    "distribution",\n    "laboratories",\n    "imponderables",\n    "evaluation",\n    "closure",\n    "executiveSummary",\n    "bibliography",\n    "annexes"\n  ];\n})();\n''', encoding='utf-8')
          PY

      - name: Validate hotfix
        shell: bash
        run: |
          set -e
          grep -q 'pdf/config/areas.js?v=20260904-hotfix-3' complexivo/index.html
          grep -q 'pdf/sections/methodology/operational-plan.js?v=20260904-hotfix-3' complexivo/index.html
          ! grep -q 'pdf/sections/general-summary.js' complexivo/index.html
          node --check complexivo/pdf/config/areas.js
          node --check complexivo/pdf/sections/methodology/operational-plan.js
          node --check complexivo/pdf/sections/methodology/index.js
          node --check complexivo/pdf/document-outline.js

      - name: Commit hotfix to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add complexivo/index.html complexivo/pdf/document-outline.js
          git commit -m "Fix Complexivo operational plan loading"
          git push origin HEAD:main
