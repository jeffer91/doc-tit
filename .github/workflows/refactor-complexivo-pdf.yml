name: Refactor Complexivo PDF into modules

on:
  push:
    paths:
      - ".github/workflows/refactor-complexivo-pdf.yml"

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Recover refactor script
        shell: bash
        run: |
          git show 5702361227fe988a9651d4177654b76c4ed70dd3:.github/workflows/refactor-complexivo-pdf.yml > /tmp/previous-refactor.yml
          python -c "from pathlib import Path; src=Path('/tmp/previous-refactor.yml').read_text(encoding='utf-8'); marker=\"          python - <<'PY'\\n\"; start=src.index(marker)+len(marker); end=src.index('\\n          PY\\n',start); block=src[start:end]; lines=[line[10:] if line.startswith('          ') else line for line in block.splitlines()]; Path('/tmp/refactor_complexivo_pdf.py').write_text('\\n'.join(lines)+'\\n',encoding='utf-8')"
          python -c "from pathlib import Path; p=Path('/tmp/refactor_complexivo_pdf.py'); s=p.read_text(encoding='utf-8'); needle='if old_body not in source:'; fixed='old_body = \\\"  const BODY = {\\\\n    left: 72,\\\\n    right: 72,\\\\n    top: 108,\\\\n    bottom: 62,\\\\n    fontSize: 12,\\\\n    lineHeight: 24,\\\\n    paragraphIndent: 36\\\\n  };\\\"\\nif old_body not in source:'; assert needle in s; p.write_text(s.replace(needle,fixed,1),encoding='utf-8')"
          python /tmp/refactor_complexivo_pdf.py

      - name: Syntax checks
        shell: bash
        run: |
          node --check complexivo/full-document.js
          find complexivo/pdf -name '*.js' -print0 | xargs -0 -n1 node --check
          test -f complexivo/pdf/sections/cover.js
          test -f complexivo/pdf/components/header.js
          test -f complexivo/pdf/sections/introduction.js
          test -f complexivo/pdf/config/institutional.js
          grep -q 'pdf/sections/cover.js' complexivo/index.html
          grep -q 'renderSection("cover")' complexivo/full-document.js

      - name: Commit modular architecture directly to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add complexivo/full-document.js complexivo/index.html complexivo/pdf
          git add -u complexivo
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refactor Complexivo PDF into section modules"
          git push origin HEAD:main
