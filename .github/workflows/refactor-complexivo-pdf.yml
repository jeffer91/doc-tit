name: Refactor Complexivo PDF into modules

on:
  push:
    paths:
      - ".github/workflows/refactor-complexivo-pdf.yml"

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Recover and run refactor script
        shell: bash
        run: |
          git show HEAD^:.github/workflows/refactor-complexivo-pdf.yml > /tmp/previous-refactor.yml
          python - <<'PY'
          from pathlib import Path
          src=Path('/tmp/previous-refactor.yml').read_text(encoding='utf-8')
          marker="          python - <<'PY'\n"
          start=src.index(marker)+len(marker)
          end=src.index("\n          PY\n",start)
          block=src[start:end]
          lines=[]
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/refactor_complexivo_pdf.py').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          python /tmp/refactor_complexivo_pdf.py

      - name: Syntax and registration checks
        shell: bash
        run: |
          set -e
          node --check complexivo/full-document.js
          find complexivo/pdf -name '*.js' -print0 | xargs -0 -n1 node --check
          node - <<'NODE'
          const fs=require('fs');
          global.window={};
          const files=[
            'complexivo/pdf/config/layout.js','complexivo/pdf/config/institutional.js','complexivo/pdf/document-outline.js',
            'complexivo/pdf/components/header.js','complexivo/pdf/components/signature-block.js','complexivo/pdf/components/footer.js',
            'complexivo/pdf/sections/cover.js','complexivo/pdf/sections/index.js','complexivo/pdf/sections/executive-summary.js',
            'complexivo/pdf/sections/introduction.js','complexivo/pdf/sections/legal-basis.js',
            'complexivo/pdf/sections/methodology/schedule.js','complexivo/pdf/sections/methodology/responsibilities.js','complexivo/pdf/sections/methodology/index.js',
            'complexivo/pdf/sections/requirements/index.js','complexivo/pdf/sections/requirements/financial-schedule.js',
            'complexivo/pdf/sections/exam-description.js','complexivo/pdf/sections/seminars.js',
            'complexivo/pdf/sections/distribution/graphs.js','complexivo/pdf/sections/distribution/index.js',
            'complexivo/pdf/sections/laboratories.js','complexivo/pdf/sections/imponderables.js','complexivo/pdf/sections/evaluation.js','complexivo/pdf/sections/bibliography.js',
            'complexivo/full-document.js'
          ];
          files.forEach(f=>eval(fs.readFileSync(f,'utf8')));
          const ns=window.DOC_TIT_COMPLEXIVO_PDF;
          const required=['cover','index','executiveSummary','introduction','legalBasis','methodology','requirements','examDescription','seminars','distribution','laboratories','imponderables','evaluation','bibliography'];
          required.forEach(id=>{ if(typeof ns.sections?.[id]?.render!=='function') throw new Error('Missing section '+id); });
          ['header','signatureBlock','footer'].forEach(id=>{ if(typeof ns.components?.[id]?.render!=='function') throw new Error('Missing component '+id); });
          if(typeof window.DocTitFullDocument?.generateAndDownload!=='function') throw new Error('Missing PDF entry point');
          console.log('Complexivo PDF modular registry OK');
          NODE

      - name: Commit modular architecture directly to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add complexivo/full-document.js complexivo/index.html complexivo/pdf
          git add -u complexivo
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refactor Complexivo PDF into section modules"
          git push origin HEAD:main
