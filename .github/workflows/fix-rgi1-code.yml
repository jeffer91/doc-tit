name: Fix RGI1 document code

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-rgi1-code.yml'

permissions:
  contents: write

jobs:
  fix-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update document code logic
        shell: python
        run: |
          from pathlib import Path

          path = Path("complexivo/app.js")
          text = path.read_text(encoding="utf-8")
          old = '''  function documentCode(doc,period){
            // El RGI conserva literalmente el código documental asignado; el período no forma parte del código.
            return `${doc.prefix}${doc.sequence}-${doc.process}`;
          }'''
          new = '''  function documentCode(doc,period){
            const {year,month}=monthYear(period.start);
            return `${doc.prefix}${doc.sequence}-${doc.process}-${year}-${month}`;
          }'''
          if old not in text:
              raise SystemExit("Expected documentCode block was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add complexivo/app.js
          git commit -m "Use period year and month in RGI1 code"
          git push
