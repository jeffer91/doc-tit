name: Fix RGI1 document code

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-rgi1-code.yml'

permissions:
  contents: write

jobs:
  fix-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update document code logic
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("complexivo/app.js")
          text = path.read_text(encoding="utf-8")
          pattern = r'  function documentCode\(doc,period\)\{.*?\n  \}\n  function docStoreKey'
          replacement = '''  function documentCode(doc,period){
            const {year,month}=monthYear(period.start);
            return `${doc.prefix}${doc.sequence}-${doc.process}-${year}-${month}`;
          }
          function docStoreKey'''
          updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f"Expected one documentCode block, found {count}")
          path.write_text(updated, encoding="utf-8")
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add complexivo/app.js
          git commit -m "Use period year and month in RGI1 code"
          git push
