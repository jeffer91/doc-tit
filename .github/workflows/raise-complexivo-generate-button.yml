name: Raise Complexivo Generate Button

on:
  push:
    paths:
      - '.github/workflows/raise-complexivo-generate-button.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply button patch
        run: python .github/scripts/raise_complexivo_generate_button.py
      - name: Validate JavaScript
        run: node --check complexivo/data-workspace.js
      - name: Validate wiring
        run: |
          grep -q 'function generationGate' complexivo/data-workspace.js
          grep -q 'doc-generate-top' complexivo/data-workspace.js
          grep -q 'updateTopGenerateButton' complexivo/data-workspace.js
          grep -q 'data-workspace.js?v=20260910-generate-top-1' complexivo/index.html
      - name: Commit changes
        run: |
          git config user.name 'jeffer91'
          git config user.email 'jeffersonvillarreal91@gmail.com'
          git add complexivo/data-workspace.js complexivo/index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Move Complexivo PDF action to header with readiness colors'
            git push
          fi
