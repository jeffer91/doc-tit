name: Finalize Complexivo cover

on:
  push:
    paths:
      - ".github/workflows/fix-complexivo-cover-fixed.yml"

permissions:
  contents: write

jobs:
  fix-cover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Force official cover values
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("complexivo/full-document.js")
          s = p.read_text(encoding="utf-8")
          pairs = [
              ('name:ctx.institutional?.preparedBy||"Mgs. Jefferson Villarreal"', 'name:"Mgs. Jefferson Villarreal"'),
              ('role:ctx.institutional?.preparedRole||"Coordinador de Titulación y Eficiencia Terminal"', 'role:"Coordinador de Titulación y Eficiencia Terminal"'),
              ('name:ctx.institutional?.reviewedBy||"Ing. Martha Tomalá"', 'name:"Ing. Martha Tomalá"'),
              ('role:ctx.institutional?.reviewedRole||"Coordinadora General de Carreras"', 'role:"Coordinadora General de Carreras"'),
              ('name:ctx.institutional?.approvedBy||"Dr. Alex León"', 'name:"Dr. Alex León"'),
              ('role:ctx.institutional?.approvedRole||"Vicerrector"', 'role:"Vicerrector"'),
          ]
          changed = 0
          for old, new in pairs:
              if old in s:
                  s = s.replace(old, new)
                  changed += 1
          if changed != 6:
              raise SystemExit(f"Expected 6 cover replacements, got {changed}")
          p.write_text(s, encoding="utf-8")
          PY

      - name: Commit fix directly to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add complexivo/full-document.js
          git commit -m "Force official Complexivo cover values"
          git push origin HEAD:main
