name: Setup DOC-TIT shared architecture

on:
  push:
    paths:
      - '.github/workflows/setup-doc-tit-shared-architecture.yml'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create shared architecture and sidebar navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          shared = root / 'shared'
          (shared / 'pdf').mkdir(parents=True, exist_ok=True)

          (shared / 'documents.js').write_text(r'''(() => {
            "use strict";
            window.DOC_TIT_DOCUMENTS = [
              {
                id: "complexivo",
                process: "PRO-56",
                group: "Planificación semestral",
                title: "Planificación del Examen Complexivo",
                shortTitle: "Examen Complexivo",
                code: "UTET-RGI1-01-PRO-56",
                path: "/doc-tit/complexivo/"
              },
              {
                id: "trabajo-titulacion",
                process: "PRO-56",
                group: "Planificación semestral",
                title: "Planificación de Trabajo de Titulación",
                shortTitle: "Trabajo de Titulación",
                code: "UGPA-RGI2-01-PRO-56",
                path: "/doc-tit/trabajo-titulacion/"
              },
              {
                id: "articulo-academico",
                process: "PRO-56",
                group: "Planificación semestral",
                title: "Planificación de Artículo Académico",
                shortTitle: "Artículo Académico",
                code: "UTET-RGI3-01-PRO-56",
                path: "/doc-tit/articulo-academico/"
              }
            ];
          })();
          ''', encoding='utf-8')

          (shared / 'sidebar.js').write_text(r'''(() => {
            "use strict";

            function normalizePath(path) {
              let value = String(path || "/").replace(/\\/g, "/");
              if (!value.endsWith("/")) value += "/";
              return value;
            }

            function resolveBasePath() {
              const path = normalizePath(window.location.pathname);
              const marker = "/doc-tit/";
              const idx = path.indexOf(marker);
              if (idx >= 0) return path.slice(0, idx) + marker;
              return "/doc-tit/";
            }

            function activeDocumentId() {
              const explicit = document.querySelector("[data-doc-tit-navigation]")?.dataset.activeDocument;
              if (explicit) return explicit;
              const path = normalizePath(window.location.pathname);
              const match = (window.DOC_TIT_DOCUMENTS || []).find(doc => path.includes(`/${doc.id}/`));
              return match?.id || "";
            }

            function hrefFor(doc) {
              const base = resolveBasePath();
              return base + String(doc.id || "").replace(/^\/+|\/+$/g, "") + "/";
            }

            function renderNavigation(container) {
              const docs = Array.isArray(window.DOC_TIT_DOCUMENTS) ? window.DOC_TIT_DOCUMENTS : [];
              if (!docs.length) return;

              const activeId = activeDocumentId();
              const groups = new Map();
              docs.forEach(doc => {
                const key = `${doc.process}::${doc.group}`;
                if (!groups.has(key)) groups.set(key, { process: doc.process, group: doc.group, docs: [] });
                groups.get(key).docs.push(doc);
              });

              container.innerHTML = "";
              container.classList.add("doc-tit-nav");

              groups.forEach(group => {
                const section = document.createElement("section");
                section.className = "doc-tit-nav-group";
                section.innerHTML = `
                  <div class="doc-tit-nav-group-title">
                    <span class="doc-tit-nav-code">${group.process}</span>
                    <span>${group.group}</span>
                  </div>
                  <div class="doc-tit-nav-links"></div>
                `;

                const links = section.querySelector(".doc-tit-nav-links");
                group.docs.forEach(doc => {
                  const link = document.createElement("a");
                  link.className = "doc-tit-nav-link" + (doc.id === activeId ? " active" : "");
                  link.href = hrefFor(doc);
                  link.dataset.documentId = doc.id;
                  link.innerHTML = `<span class="doc-tit-nav-dot" aria-hidden="true"></span><span>${doc.title}</span>`;
                  if (doc.id === activeId) link.setAttribute("aria-current", "page");
                  links.appendChild(link);
                });

                container.appendChild(section);
              });
            }

            function init() {
              document.querySelectorAll("[data-doc-tit-navigation]").forEach(renderNavigation);
            }

            if (document.readyState === "loading") {
              document.addEventListener("DOMContentLoaded", init, { once: true });
            } else {
              init();
            }
          })();
          ''', encoding='utf-8')

          (shared / 'sidebar.css').write_text(r'''.doc-tit-global-nav{margin:14px 0 16px}.doc-tit-nav{display:flex;flex-direction:column;gap:10px}.doc-tit-nav-group{display:block}.doc-tit-nav-group-title{display:flex;align-items:center;gap:8px;color:#d9e6f1;font-size:12px;font-weight:800;padding:8px 8px 7px}.doc-tit-nav-code{display:inline-flex;align-items:center;justify-content:center;min-width:46px;padding:4px 6px;border-radius:7px;background:rgba(255,255,255,.08);color:#fff;font-size:9px;letter-spacing:.02em}.doc-tit-nav-links{display:flex;flex-direction:column;gap:2px;margin-left:34px;border-left:1px solid rgba(155,190,219,.28);padding-left:10px}.doc-tit-nav-link{display:flex;align-items:flex-start;gap:7px;padding:7px 8px;border-radius:8px;color:#b9d5eb!important;text-decoration:none!important;font-size:12px;line-height:1.25;transition:background .15s ease,color .15s ease}.doc-tit-nav-link:hover{background:rgba(255,255,255,.07);color:#fff!important}.doc-tit-nav-link.active{background:rgba(26,158,216,.18);color:#fff!important;font-weight:800}.doc-tit-nav-dot{width:5px;height:5px;border-radius:50%;background:currentColor;margin-top:5px;flex:0 0 auto}.doc-tit-global-heading{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#7fa1bc;font-weight:800;margin:12px 0 4px;padding:0 8px}@media(max-width:900px){.doc-tit-nav-links{margin-left:18px}}
          ''', encoding='utf-8')

          (shared / 'institutional-config.js').write_text(r'''(() => {
            "use strict";
            window.DOC_TIT_INSTITUTIONAL = Object.freeze({
              unit: "Unidad de Titulación y Eficiencia Terminal",
              preparedBy: "Mgs. Jefferson Villarreal",
              preparedRole: "Coordinador de Titulación y Eficiencia Terminal",
              reviewedBy: "Ing. Martha Tomalá",
              reviewedRole: "Coordinadora General de Carreras",
              approvedBy: "Dr. Alex León",
              approvedRole: "Vicerrector"
            });
          })();
          ''', encoding='utf-8')

          (shared / 'pdf' / 'standards.js').write_text(r'''(() => {
            "use strict";
            const CM = 72 / 2.54;
            window.DOC_TIT_PDF_STANDARDS = Object.freeze({
              page: Object.freeze({ format: "a4", orientation: "portrait", marginCm: 1.5, usableWidthCm: 18 }),
              rgi: Object.freeze({
                headerWidthCm: 18,
                headerColumnsCm: Object.freeze([4.5, 9, 4.5]),
                headerUnitPt: 9,
                headerDocumentPt: 9,
                headerPeriodPt: 9,
                centralTitlePt: 23,
                centralSupplementPt: 10,
                signatureColumnsCm: Object.freeze([6, 6, 6]),
                coverPageNumber: false
              }),
              tables: Object.freeze({
                bodyFontPt: 10,
                captionFontPt: 11,
                noteFontPt: 10,
                rowPageBreak: "avoid",
                repeatHeader: true,
                apaHorizontalRules: true
              }),
              cmToPt(value) { return Number(value || 0) * CM; }
            });
          })();
          ''', encoding='utf-8')

          (shared / 'favicon.svg').write_text('''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
            <rect width="64" height="64" rx="14" fill="#0b2d4f"/>
            <path d="M19 12h18l10 10v30H19z" fill="#ffffff"/>
            <path d="M37 12v11h10" fill="#9ec5e8"/>
            <path d="M25 31h16M25 38h13" stroke="#0b2d4f" stroke-width="3" stroke-linecap="round"/>
            <path d="M25 46l4 4 9-10" fill="none" stroke="#2f8f5b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>\n''', encoding='utf-8')

          def patch_app_index(path, active_id, brand_label, complexivo=False):
              p = Path(path)
              text = p.read_text(encoding='utf-8')

              # Shared favicon and sidebar CSS.
              if '../shared/sidebar.css' not in text:
                  text = text.replace('</head>', '  <link rel="stylesheet" href="../shared/sidebar.css?v=20260904-1">\n</head>')
              if '../shared/favicon.svg' not in text:
                  if '<link rel="icon"' in text:
                      text = re.sub(r'\s*<link rel="icon"[^>]*>\s*', '\n  <link rel="icon" type="image/svg+xml" href="../shared/favicon.svg?v=20260904-1">\n', text, count=1)
                  else:
                      text = text.replace('<title>', '  <link rel="icon" type="image/svg+xml" href="../shared/favicon.svg?v=20260904-1">\n  <title>', 1)

              nav = f'''\n    <div class="doc-tit-global-heading">Planificaciones</div>\n    <div class="doc-tit-global-nav" data-doc-tit-navigation data-active-document="{active_id}"></div>\n'''

              if 'data-doc-tit-navigation' not in text:
                  if complexivo:
                      marker = '      <div class="menu-heading">Procesos</div>'
                      text = text.replace(marker, nav + '\n      <div class="menu-heading">Documento actual</div>', 1)
                  else:
                      marker = '    <div class="cloud" id="cloudCard">'
                      text = text.replace(marker, nav + '\n    <div class="cloud" id="cloudCard">', 1)

              shared_scripts = '''\n<script src="../shared/documents.js?v=20260904-1"></script>\n<script src="../shared/institutional-config.js?v=20260904-1"></script>\n<script src="../shared/pdf/standards.js?v=20260904-1"></script>\n<script src="../shared/sidebar.js?v=20260904-1"></script>\n'''
              if '../shared/documents.js' not in text:
                  text = text.replace('</body>', shared_scripts + '</body>')

              p.write_text(text, encoding='utf-8')

          patch_app_index('complexivo/index.html', 'complexivo', 'Examen Complexivo', complexivo=True)
          patch_app_index('trabajo-titulacion/index.html', 'trabajo-titulacion', 'Trabajo de Titulación')
          patch_app_index('articulo-academico/index.html', 'articulo-academico', 'Artículo Académico')

          # Root menu shares the favicon and document manifest for a single source of truth.
          root_index = Path('index.html')
          text = root_index.read_text(encoding='utf-8')
          if 'shared/favicon.svg' not in text:
              text = text.replace('<title>', '<link rel="icon" type="image/svg+xml" href="shared/favicon.svg?v=20260904-1">\n<title>', 1)
          root_index.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          readme.write_text('''# DOC-TIT\n\nGestión documental del proceso de titulación.\n\n## Arquitectura\n\nDOC-TIT funciona como una plataforma con navegación común y aplicaciones independientes por documento.\n\n- `/complexivo/` — Planificación del Examen Complexivo · `UTET-RGI1-01-PRO-56`\n- `/trabajo-titulacion/` — Planificación de Trabajo de Titulación · `UGPA-RGI2-01-PRO-56`\n- `/articulo-academico/` — Planificación de Artículo Académico · `UTET-RGI3-01-PRO-56`\n\nLa raíz del sitio funciona únicamente como menú general. El panel lateral de cada aplicación permite cambiar directamente entre las tres planificaciones sin volver al menú general.\n\n## Componentes compartidos\n\n`/shared/` concentra solamente estándares y navegación reutilizables:\n\n- `documents.js` — manifiesto maestro de documentos y rutas.\n- `sidebar.js` / `sidebar.css` — navegación lateral común.\n- `institutional-config.js` — responsables institucionales comunes.\n- `pdf/standards.js` — constantes maestras RGI, portada, tablas y paginación para nuevos generadores.\n- `favicon.svg` — identidad visual común.\n\nEl contenido, cronograma, diccionario de actividades, validaciones y generador de cada planificación permanecen dentro de su propia carpeta.\n\n## Datos\n\nLas aplicaciones comparten los períodos institucionales en Supabase, pero cada documento guarda su información con un `document_key` independiente.\n\nTrabajo de Titulación y Artículo Académico incluyen descarga de plantilla Excel, importación inteligente, validación, guardado y generación del PDF.\n\nGitHub Pages publica el repositorio completo mediante `.github/workflows/pages.yml`.\n''', encoding='utf-8')

          # Root-level legacy application files are no longer referenced by the root menu.
          for legacy in [
              'app.js','cloud.js','full-document.js','styles.css',
              'template-chunk-1.js','template-chunk-2.js','template-chunk-3.js','template-chunk-4.js'
          ]:
              p = Path(legacy)
              if p.exists():
                  p.unlink()

          # Remove this one-shot workflow after applying the migration.
          wf = Path('.github/workflows/setup-doc-tit-shared-architecture.yml')
          if wf.exists():
              wf.unlink()
          PY

      - name: Commit architecture migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Create shared DOC-TIT navigation architecture"
          git push origin main
