name: Fix Complexivo APA table rules

on:
  push:
    paths:
      - ".github/workflows/fix-complexivo-apa-lines.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply APA table rule fix
        run: python .github/scripts/fix_complexivo_apa_lines.py
      - name: Validate JavaScript
        run: node --check complexivo/full-document.js
      - name: Commit directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-complexivo-apa-lines.yml .github/scripts/fix_complexivo_apa_lines.py
          git add complexivo/full-document.js complexivo/index.html
          git commit -m "Fix Complexivo APA table border rendering"
          git push origin HEAD:main
