name: Add Complexivo favicon

on:
  push:
    paths:
      - ".github/workflows/add-complexivo-favicon.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add favicon link
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('complexivo/index.html')
          s=p.read_text(encoding='utf-8')
          link='  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=20260904-1" />\n'
          if 'rel="icon"' not in s:
              anchor='  <meta name="theme-color" content="#0b2d4f" />\n'
              if anchor not in s:
                  raise SystemExit('No se encontró el punto de inserción del favicon')
              s=s.replace(anchor, anchor+link, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit directly to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-complexivo-favicon.yml
          git add complexivo/index.html
          git commit -m "Wire DOC-TIT favicon into Complexivo app"
          git push origin main
