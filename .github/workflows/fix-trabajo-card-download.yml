name: Fix Trabajo Card Download

on:
  push:
    paths:
      - '.github/workflows/fix-trabajo-card-download.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply direct download fix
        run: python .github/scripts/fix_trabajo_card_download.py
      - name: Validate JavaScript
        run: node --check shared/module-ui.js
      - name: Validate direct handler
        run: |
          grep -q 'source.onclick.call(source,event)' shared/module-ui.js
          ! grep -q 'download-card-fix.js' trabajo-titulacion/index.html
          grep -q 'module-ui.js?v=20260910-audit-5' trabajo-titulacion/index.html
      - name: Commit fix
        run: |
          git config user.name 'jeffer91'
          git config user.email 'jeffersonvillarreal91@gmail.com'
          git add shared/module-ui.js trabajo-titulacion/index.html articulo-academico/index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Fix Trabajo card download action directly'
            git push
          fi
