name: Fix continuous Complexivo index

on:
  push:
    paths:
      - ".github/workflows/fix-complexivo-index.yml"

permissions:
  contents: write

jobs:
  fix-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make index continuous
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("complexivo/full-document.js")
          text = path.read_text(encoding="utf-8")

          reserve_pattern = re.compile(
              r'    function reserveIndexPages\(\)\{\n'
              r'\s*newPage\(\);\n'
              r'\s*newPage\(\);\n'
              r'\s*// La introducción debe iniciar en una página nueva, nunca sobre el índice\.\n'
              r'\s*newPage\(\);\n'
              r'\s*\}'
          )
          reserve_replacement = '''    function reserveIndexPages(){
              // Una sola página de índice; el contenido comienza inmediatamente después.
              newPage();
              newPage();
            }'''

          text, reserve_count = reserve_pattern.subn(reserve_replacement, text, count=1)
          if reserve_count != 1:
              raise SystemExit(f"Se esperó modificar reserveIndexPages una vez y se modificó {reserve_count}")

          fill_pattern = re.compile(
              r'      const heights=dedup\.map\(tocEntryHeight\);.*?'
              r'      drawTOCPage\(3,"",dedup\.slice\(splitAt\)\);',
              re.S,
          )
          fill_replacement = '''      // El índice se presenta de forma continua en una sola página.
              drawTOCPage(2,"Índice",dedup);'''

          text, fill_count = fill_pattern.subn(fill_replacement, text, count=1)
          if fill_count != 1:
              raise SystemExit(f"Se esperó modificar fillIndex una vez y se modificó {fill_count}")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit fix directly to main
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add complexivo/full-document.js
          git commit -m "Make Complexivo index continuous"
          git push origin HEAD:main
