name: Fix Complexivo tables and operational plan

on:
  push:
    paths:
      - ".github/workflows/fix-complexivo-tables.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/fix_complexivo_tables.py
      - name: Validate JavaScript
        run: |
          node --check complexivo/full-document.js
          node --check complexivo/pdf/sections/methodology/operational-plan.js
          node --check complexivo/pdf/sections/annexes.js
          node --check complexivo/pdf/sections/closure.js
          node --check complexivo/pdf/sections/bibliography.js
      - name: Commit directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-complexivo-tables.yml .github/scripts/fix_complexivo_tables.py
          git add -A
          git commit -m "Fix Complexivo tables and operational placeholders"
          git push origin HEAD:main
