name: Finalize Complexivo PDF upgrade

on:
  push:
    paths:
      - ".github/workflows/finalize-complexivo-upgrade.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/finalize_complexivo_v2.py
      - name: Syntax and content checks
        shell: bash
        run: |
          node --check complexivo/full-document.js
          node --check complexivo/app.js
          find complexivo/pdf -name '*.js' -print0 | xargs -0 -n1 node --check
          ! grep -R -n --include='*.js' --include='*.html' 'Planificación De Examen Complexivo' complexivo
          ! grep -R -n --include='*.js' --include='*.html' 'Semana Requisitos' complexivo
          grep -q 'pdf/config/policy.js' complexivo/index.html
          grep -q 'pdf/sections/closure.js' complexivo/index.html
          grep -q 'pdf/sections/general-summary.js' complexivo/index.html
          grep -q 'pdf/sections/annexes.js' complexivo/index.html
          grep -q 'const insertedSectionImages=new Set();' complexivo/full-document.js
          grep -q 'joinNatural,policy' complexivo/full-document.js
      - name: Commit directly to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add complexivo
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Finalize Complexivo planning generator upgrade"
          git push origin HEAD:main
