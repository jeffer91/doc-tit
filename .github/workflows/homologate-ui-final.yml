name: DOC-TIT UI Homologation

on:
  push:
    paths:
      - '.github/workflows/homologate-ui-final.yml'

permissions:
  contents: write

jobs:
  homologate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply UI homologation
        run: python .github/scripts/homologate_ui_final.py
      - name: Capture generated UI and syntax output
        run: |
          cp shared/module-ui.js .github/debug-module-ui.js
          node --check shared/module-ui.js > .github/debug-module-ui.log 2>&1 || true
      - name: Commit diagnostics
        run: |
          git config user.name 'jeffer91'
          git config user.email 'jeffersonvillarreal91@gmail.com'
          git add .github/debug-module-ui.js .github/debug-module-ui.log
          git commit -m 'Capture temporary DOC-TIT UI diagnostics'
          git push
# diagnostic-run
