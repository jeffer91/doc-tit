name: Refresh Complexivo RGI cover assets

on:
  push:
    paths:
      - ".github/workflows/fix-complexivo-rgi-cover-cache.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate corrected PDF modules
        run: |
          node --check complexivo/pdf/components/header.js
          node --check complexivo/pdf/components/signature-block.js
          node --check complexivo/pdf/components/footer.js
          node --check complexivo/pdf/sections/cover.js
      - name: Refresh browser cache keys
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('complexivo/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('v=20260904-hotfix-3','v=20260904-cover-rgi-1')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cache refresh directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add complexivo/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Complexivo RGI cover assets"
            git push origin HEAD:main
          fi
