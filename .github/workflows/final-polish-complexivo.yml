name: Final polish Complexivo PDF

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/final-polish-complexivo.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply polish
        run: python .github/scripts/final_polish_complexivo.py

      - name: Validate JavaScript
        run: |
          node --check complexivo/full-document.js
          node --check complexivo/pdf/sections/annexes.js
          node --check complexivo/pdf/sections/bibliography.js
          node --check complexivo/pdf/config/policy.js
          node --check complexivo/pdf/sections/legal-basis.js

      - name: Validate editorial rules
        run: |
          grep -q 'if(level===1 && y>BODY.top+1) newPage();' complexivo/full-document.js
          grep -q 'options.showHead="everyPage"' complexivo/full-document.js
          grep -q 'options.rowPageBreak=options.rowPageBreak||"avoid"' complexivo/full-document.js
          grep -q 'Anexo D – Control de consistencia de la planificación' complexivo/pdf/sections/annexes.js
          grep -q 'UTET-REG-25' complexivo/pdf/sections/bibliography.js
          grep -q 'ITSQMET-OCS-2025-03-02/27-MAR-2025' complexivo/pdf/config/policy.js
          if grep -R -q 'Antes de emitir la planificación definitiva' complexivo/pdf/sections complexivo/pdf/config; then exit 1; fi

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add complexivo/full-document.js complexivo/pdf/sections/annexes.js complexivo/pdf/sections/bibliography.js complexivo/pdf/config/policy.js complexivo/pdf/sections/legal-basis.js
          git rm .github/workflows/final-polish-complexivo.yml .github/scripts/final_polish_complexivo.py
          git commit -m 'Polish Complexivo PDF layout and normative references'
          git push
