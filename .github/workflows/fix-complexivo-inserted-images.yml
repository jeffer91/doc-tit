name: Fix Complexivo PDF image state

on:
  push:
    paths:
      - ".github/workflows/fix-complexivo-inserted-images.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix missing image state and bust cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          full = Path('complexivo/full-document.js')
          s = full.read_text(encoding='utf-8')
          needle = '    const analysisInjected=new Set();\n'
          insert = '    const analysisInjected=new Set();\n    const insertedSectionImages=new Set();\n'
          if 'const insertedSectionImages=new Set();' not in s:
              if needle not in s:
                  raise SystemExit('No se encontró el punto de inserción para insertedSectionImages')
              s = s.replace(needle, insert, 1)
          full.write_text(s, encoding='utf-8')

          html = Path('complexivo/index.html')
          h = html.read_text(encoding='utf-8')
          h = h.replace('full-document.js?v=20260904-modular-1', 'full-document.js?v=20260904-modular-2')
          html.write_text(h, encoding='utf-8')
          PY

          node --check complexivo/full-document.js
          grep -q 'const insertedSectionImages=new Set();' complexivo/full-document.js
          grep -q 'full-document.js?v=20260904-modular-2' complexivo/index.html

      - name: Commit fix directly to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add complexivo/full-document.js complexivo/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Complexivo PDF inserted image state"
          git push origin HEAD:main
