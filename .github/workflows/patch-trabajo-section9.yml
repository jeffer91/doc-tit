name: Patch Trabajo Section 9

on:
  push:
    paths:
      - '.github/workflows/patch-trabajo-section9.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Section 9 patch
        run: python .github/scripts/patch_trabajo_section9.py
      - name: Validate JavaScript
        run: |
          node --check trabajo-titulacion/schedule-config.js
          node --check trabajo-titulacion/app.js
          node --check trabajo-titulacion/full-document.js
      - name: Commit changes
        run: |
          git config user.name "jeffer91"
          git config user.email "jeffersonvillarreal91@gmail.com"
          git add trabajo-titulacion/app.js trabajo-titulacion/full-document.js trabajo-titulacion/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Implement dynamic Trabajo schedule section"
            git push
          fi
