name: Patch Trabajo Section 11

on:
  push:
    paths:
      - '.github/workflows/patch-trabajo-section11.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: python .github/scripts/patch_trabajo_section11.py
      - name: Validate JavaScript
        run: |
          node --check trabajo-titulacion/conclusions-config.js
          node --check trabajo-titulacion/full-document.js
          node --check trabajo-titulacion/app.js
      - name: Validate wiring
        run: |
          grep -q 'DOC_TIT_TRABAJO_CONCLUSIONS' trabajo-titulacion/full-document.js
          grep -q '"11. Conclusiones"' trabajo-titulacion/full-document.js
          grep -q '"12. Bibliografía"' trabajo-titulacion/full-document.js
          grep -q 'renderConclusions' trabajo-titulacion/full-document.js
          grep -q 'conclusions:currentConclusionsSnapshot()' trabajo-titulacion/app.js
          grep -q 'approveScheduleBtn' trabajo-titulacion/app.js
          grep -q 'scheduleValidation().length===0&&payload.scheduleMeta?.status==="Aprobado"' trabajo-titulacion/app.js
          grep -q 'conclusions-config.js' trabajo-titulacion/index.html
      - name: Commit changes
        run: |
          git config user.name 'jeffer91'
          git config user.email 'jeffersonvillarreal91@gmail.com'
          git add trabajo-titulacion/full-document.js trabajo-titulacion/app.js trabajo-titulacion/index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Implement controlled Trabajo conclusions section'
            git push
          fi
