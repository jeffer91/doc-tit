name: Patch Trabajo Section 12

on:
  push:
    paths:
      - '.github/workflows/patch-trabajo-section12.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: python .github/scripts/patch_trabajo_section12.py
      - name: Validate JavaScript
        run: |
          node --check trabajo-titulacion/recommendations-config.js
          node --check trabajo-titulacion/full-document.js
          node --check trabajo-titulacion/app.js
      - name: Validate wiring
        run: |
          grep -q 'DOC_TIT_TRABAJO_RECOMMENDATIONS' trabajo-titulacion/full-document.js
          grep -q '"12. Recomendaciones"' trabajo-titulacion/full-document.js
          grep -q '"13. Bibliografía"' trabajo-titulacion/full-document.js
          grep -q 'renderRecommendations' trabajo-titulacion/full-document.js
          grep -q 'recommendations:currentRecommendationsSnapshot()' trabajo-titulacion/app.js
          grep -q 'recommendations-config.js' trabajo-titulacion/index.html
          grep -q 'cronograma_aprobado' trabajo-titulacion/recommendations-config.js
      - name: Commit changes
        run: |
          git config user.name 'jeffer91'
          git config user.email 'jeffersonvillarreal91@gmail.com'
          git add trabajo-titulacion/full-document.js trabajo-titulacion/app.js trabajo-titulacion/index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Implement controlled Trabajo recommendations section'
            git push
          fi
