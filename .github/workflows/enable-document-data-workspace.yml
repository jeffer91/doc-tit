name: Enable document data workspace

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-document-data-workspace.yml'

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable table workspace
        shell: python
        run: |
          from pathlib import Path
          path=Path('complexivo/index.html')
          text=path.read_text(encoding='utf-8')
          old='<script src="app.js?v=20260904-tables-1"></script>'
          new=old+'\n  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>\n  <script src="operational-data.js?v=20260909-workspace-1"></script>\n  <script src="data-workspace.js?v=20260909-workspace-1"></script>'
          if 'data-workspace.js' not in text:
              if old not in text:
                  raise SystemExit('No se encontró el punto de inserción en complexivo/index.html')
              text=text.replace(old,new,1)
              path.write_text(text,encoding='utf-8')

      - name: Validate JavaScript
        run: |
          node --check complexivo/data-workspace.js
          node --check complexivo/operational-data.js

      - name: Validate integration
        run: |
          grep -q 'xlsx.full.min.js' complexivo/index.html
          grep -q 'operational-data.js' complexivo/index.html
          grep -q 'data-workspace.js' complexivo/index.html

      - name: Commit changes
        run: |
          git config user.name "jeffer91"
          git config user.email "jeffersonvillarreal91@gmail.com"
          git add complexivo/index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Use table-based data loading workspace"
            git push
          fi
