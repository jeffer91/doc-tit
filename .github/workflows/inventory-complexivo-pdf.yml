name: Inventory Complexivo PDF

on:
  push:
    paths:
      - ".github/workflows/inventory-complexivo-pdf.yml"

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory functions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('complexivo/full-document.js')
          s=p.read_text(encoding='utf-8')
          rows=[]
          for i,line in enumerate(s.splitlines(),1):
              m=re.search(r'\b(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(', line)
              if m:
                  rows.append(f'{i:04d} {m.group(1)}')
          Path('complexivo/PDF_FUNCTION_INVENTORY.txt').write_text('\n'.join(rows)+'\n',encoding='utf-8')
          PY
      - name: Commit inventory
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add complexivo/PDF_FUNCTION_INVENTORY.txt
          git commit -m "Add temporary Complexivo PDF function inventory"
          git push origin HEAD:main
