<head>

<title>DOC-TIT · Gestión documental</title>
<script>
(() => {
  "use strict";
  const allowed = new Set(["complexivo", "trabajo-titulacion", "articulo-academico"]);
  const saved = localStorage.getItem("doc-tit-last-document");
  const target = allowed.has(saved) ? saved : "complexivo";
  window.location.replace(`./${target}/`);
})();
</script>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fa;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033}.loading{text-align:center;padding:24px}.loading strong{display:block;font-size:18px;margin-bottom:6px}.loading span{font-size:13px;color:#687386}
</style>
</head>
<body>
<div class="loading"><strong>DOC-TIT</strong><span>Abriendo planificación…</span></div>
<noscript><p><a href="complexivo/">Abrir DOC-TIT</a></p></noscript>
</body>
</html>
